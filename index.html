<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Perspectiva</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#050507;--fg:#f4ecdf;--accent:#e8a35f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;overflow:hidden}
canvas{display:block;touch-action:none}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:rgba(5,5,7,.86);z-index:5}
#ov h1{font-weight:400;font-size:2.4rem;margin:0;letter-spacing:.02em}
#ov p{max-width:34rem;line-height:1.55;margin:0;opacity:.85}
button{font:inherit;padding:12px 24px;border-radius:999px;border:1px solid var(--accent);background:transparent;color:var(--fg);cursor:pointer}
button:hover,button:focus-visible{background:var(--accent);color:#1a1208;outline:none}
#sit{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:none;z-index:4}
#hint{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:.85rem;opacity:.6;z-index:3;pointer-events:none}
label{font-size:.9rem;opacity:.8}
</style></head><body>
<div id="ov">
<h1>Perspectiva</h1>
<p>Prototipo de las escenas 1 a 5. Funciona en pantalla (arrastra para mirar) y en visor VR. Si usas visor, elige un lugar seguro donde puedas sentarte.</p>
<label><input type="checkbox" id="voice" checked> Narración con voz</label>
<select id="vsel" style="max-width:90%;padding:6px;background:#111;color:inherit;border:1px solid #444;border-radius:8px"><option value="">Voz automática (latina si existe)</option></select>
<button id="go">Comenzar en pantalla</button>
<button id="vr" style="display:none">Entrar en VR</button>
</div>
<div id="hint">Arrastra para mirar alrededor</div>
<button id="sit">Ya estoy sentado</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const R=new THREE.WebGLRenderer({antialias:true,logarithmicDepthBuffer:true});

// Tierra: la superficie coincide con el suelo (y=0) y se encoge bajo los pies
const gA=new THREE.Color(0x3b5a3c),gB=new THREE.Color(0x2c68a0);
const earth=new THREE.Mesh(new THREE.SphereGeometry(1,128,96),new THREE.MeshStandardMaterial({color:gA.clone(),roughness:1}));
earth.scale.setScalar(6371);earth.position.y=-6371;S.add(earth);

const stars=new THREE.Points((()=>{const g=new THREE.BufferGeometry(),a=[];for(let i=0;i<2500;i++){const v=new THREE.Vector3().randomDirection?new THREE.Vector3().randomDirection():new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize();a.push(v.x*9000,v.y*9000,v.z*9000)}g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));return g})(),
 new THREE.PointsMaterial({color:0xffffff,size:1.6,sizeAttenuation:false,transparent:true,opacity:0,depthWrite:false}));
S.add(stars);

function glowTex(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);
 g.addColorStop(0,'rgba(255,230,170,1)');g.addColorStop(.25,'rgba(255,190,100,.55)');g.addColorStop(1,'rgba(255,150,60,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}
const GT=glowTex();

const TEX=(()=>{const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d');x.fillStyle='#d9d9d9';x.fillRect(0,0,512,256);
 for(let i=0;i<5000;i++){const v=Math.random()<.5?255:70;x.fillStyle=`rgba(${v},${v},${v},${.12+Math.random()*.2})`;x.beginPath();x.arc(Math.random()*512,Math.random()*256,1+Math.random()*4,0,6.3);x.fill()}
 for(let i=0;i<7;i++){const gx=Math.random()*512,gy=40+Math.random()*176,g=x.createRadialGradient(gx,gy,0,gx,gy,22);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(gx-22,gy-22,44,44)}
 return new THREE.CanvasTexture(c)})();
const spin=[];
function mkSun(){const g=new THREE.Group(),m0=new THREE.Mesh(new THREE.SphereGeometry(1,48,32),new THREE.MeshBasicMaterial({map:TEX,color:0xffa733}));spin.push([m0,.2]);g.add(m0);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:GT,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,opacity:.8}));s.scale.setScalar(5);g.add(s);return g}
// Sol lejano (escenas 1-4): 0,5 grados de ancho, 4 grados sobre el horizonte
const sun=mkSun();sun.position.set(0,35,-499);sun.scale.setScalar(2.2);S.add(sun);

function label(text,h){const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');
 x.font='bold 44px Georgia';x.textAlign='center';x.fillStyle='#f4ecdf';x.shadowColor='#000';x.shadowBlur=8;x.fillText(text,256,76);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));s.scale.set(h*4,h,1);return s}

// Mundo comparativo (escalas 1 Tierra = 1,5 unidades): planetas y Sol grande
const W=new THREE.Group();S.add(W);
const E=1.5, fmt=n=>n.toLocaleString('es-CO');
const defs=[['Marte',.53,0xc1633c,6779],['Venus',.95,0xe0c07a,12104],['Neptuno',3.86,0x3f63d8,49244],['Urano',4.01,0x8fd6dc,50724],['Saturno',9.45,0xd8be8c,116460],['Júpiter',10.97,0xc89a70,139820]];
const planets=[];let total=-12;defs.forEach(d=>total+=2*d[1]*E+12);let px=-total/2;
defs.forEach(d=>{const r=d[1]*E,g=new THREE.Group(),m=new THREE.Mesh(new THREE.SphereGeometry(1,48,32),new THREE.MeshStandardMaterial({color:d[2],roughness:.9}));
 m.scale.setScalar(r);spin.push([m,.3]);g.add(m);const lb=label(d[0]+' · '+fmt(d[3])+' km',5);lb.position.y=-r-4;g.add(lb);
 g.position.set(px+r,0,-140);px+=2*r+12;g.scale.setScalar(.0001);g.visible=false;W.add(g);planets.push(g)});
const eLabel=label('Tierra · 12.756 km',1.2);eLabel.position.set(0,-4.6,-5);eLabel.visible=false;S.add(eLabel);
const bigSun=mkSun();bigSun.position.set(-280,0,-140);bigSun.scale.setScalar(.001);bigSun.visible=false;W.add(bigSun);

// Valle realista: cielo, terreno con colinas, pasto, flores, árboles, cordilleras, nubes suaves, mariposas y aves
const land=new THREE.Group();S.add(land);const anim=[];const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp01=x=>Math.max(0,Math.min(1,x)),sstep=(a,b,x)=>{const t=clamp01((x-a)/(b-a));return t*t*(3-2*t)};
const cc=new THREE.Color(),cc2=new THREE.Color(),cc3=new THREE.Color();
function hf(x,z){const d=Math.hypot(x,z),m=sstep(10,70,d);
 return m*(Math.sin(x*.021+1.3)*Math.cos(z*.017)*3.4+Math.sin(x*.047+z*.039)*1.3+Math.sin(x*.11-z*.09)*.3)+sstep(140,420,d)*22*(.6+.4*Math.sin(Math.atan2(z,x)*3+1))*(.7+.3*Math.sin(x*.02+z*.03))}
// Cielo de atardecer (se desvanece al salir al espacio)
const sky=new THREE.Mesh(new THREE.SphereGeometry(20000,32,24),new THREE.MeshBasicMaterial({map:(()=>{const c=document.createElement('canvas');c.width=4;c.height=512;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,512);
 [[0,'#1d2b52'],[.22,'#3d4a7a'],[.38,'#b8607e'],[.46,'#f08c5c'],[.5,'#ffc88a'],[.54,'#f08c5c'],[.7,'#7a4a6e'],[1,'#2a2448']].forEach(q=>g.addColorStop(q[0],q[1]));x.fillStyle=g;x.fillRect(0,0,4,512);return new THREE.CanvasTexture(c)})(),side:THREE.BackSide,transparent:true,depthWrite:false}));
sky.renderOrder=-10;S.add(sky);
// Estrellas de colores, banda de la Vía Láctea
const SL=[];function mkStars(n,size,band,base){const g=new THREE.BufferGeometry(),P=[],C=[],nv=new THREE.Vector3(.3,.9,.3).normalize(),v=new THREE.Vector3(),c=new THREE.Color();
 for(let i=0;i<n;i++){v.set(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize();if(band){v.addScaledVector(nv,-v.dot(nv)*.92).normalize()}
  P.push(v.x*9000,v.y*9000,v.z*9000);c.setHSL(Math.random()<.5?.6:.08,.5,.7+Math.random()*.3);C.push(c.r,c.g,c.b)}
 g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
 const pt=new THREE.Points(g,new THREE.PointsMaterial({size,sizeAttenuation:false,vertexColors:true,transparent:true,opacity:0,depthWrite:false}));S.add(pt);SL.push([pt,base])}
mkStars(6000,1.2,true,.55);mkStars(220,3.2,false,1);
// Terreno con colinas y color por vértice
{const g=new THREE.PlaneGeometry(1300,1300,180,180);g.rotateX(-Math.PI/2);const p=g.attributes.position,c=[],col=new THREE.Color(),A=new THREE.Color(0x3f7a2e),B=new THREE.Color(0x8aa63e),D=new THREE.Color(0x6b5a2f),E2=new THREE.Color(0x3b5a3c);
 for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),d=Math.hypot(x,z),e=sstep(600,650,d);p.setY(i,hf(x,z)*(1-e)-e*8);
  const n=.5+.5*Math.sin(x*.07)*Math.cos(z*.06)+.25*Math.sin(x*.31+z*.27);col.copy(A).lerp(B,clamp01(n*.9)).lerp(D,clamp01(Math.sin(x*.013+z*.021)*.5-.1)).lerp(E2,e);c.push(col.r,col.g,col.b)}
 g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));g.computeVertexNormals();
 const t=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1}));t.position.y=.03;land.add(t)}
// Pasto, flores con tallo y árboles
{const d=new THREE.Object3D(),N=9000,gr=new THREE.InstancedMesh(new THREE.ConeGeometry(.045,.42,3),new THREE.MeshStandardMaterial({roughness:1}),N);
 for(let i=0;i<N;i++){const a=Math.random()*6.283,r=Math.pow(Math.random(),.7)*60,x=Math.cos(a)*r,z=Math.sin(a)*r,s=rnd(.6,1.7);
  d.position.set(x,hf(x,z)+.03+.21*s,z);d.rotation.set(rnd(-.25,.25),rnd(0,6),rnd(-.25,.25));d.scale.set(1,s,1);d.updateMatrix();gr.setMatrixAt(i,d.matrix);
  gr.setColorAt(i,cc.set(0x3f7a2e).lerp(cc2.set(0xa6c45a),Math.random()).lerp(cc3.set(0xc9b45a),Math.random()<.12?.6:0))}
 const M=700,st=new THREE.InstancedMesh(new THREE.CylinderGeometry(.008,.01,.4,4),new THREE.MeshStandardMaterial({color:0x4a7a35}),M),hd=new THREE.InstancedMesh(new THREE.SphereGeometry(.07,7,5),new THREE.MeshBasicMaterial(),M),cs=[0xffffff,0xffd23f,0xff6b9a,0xb98cff,0xff8a3d];
 for(let i=0;i<M;i++){const a=Math.random()*6.283,r=Math.pow(Math.random(),.8)*50,x=Math.cos(a)*r,z=Math.sin(a)*r,y=hf(x,z)+.03;d.rotation.set(0,0,0);d.scale.setScalar(1);d.position.set(x,y+.2,z);d.updateMatrix();st.setMatrixAt(i,d.matrix);
  d.position.y=y+.42;d.scale.setScalar(rnd(.8,1.5));d.updateMatrix();hd.setMatrixAt(i,d.matrix);hd.setColorAt(i,cc.set(cs[i%5]))}
 land.add(gr,st,hd);
 const T=150,tr=new THREE.InstancedMesh(new THREE.CylinderGeometry(.35,.5,4,6),new THREE.MeshStandardMaterial({color:0x4a3524,roughness:1}),T),
  f1=new THREE.InstancedMesh(new THREE.ConeGeometry(2.6,6.5,7),new THREE.MeshStandardMaterial({roughness:1,flatShading:true}),T),f2=new THREE.InstancedMesh(new THREE.ConeGeometry(1.9,5,7),new THREE.MeshStandardMaterial({roughness:1,flatShading:true}),T);
 let k=0;while(k<T){const a=Math.random()*6.283;if(Math.abs(Math.atan2(Math.sin(a+Math.PI/2),Math.cos(a+Math.PI/2)))<.4)continue;
  const r=rnd(70,380),x=Math.cos(a)*r,z=Math.sin(a)*r,y=hf(x,z),s=rnd(.8,1.9);d.rotation.set(0,rnd(0,6),0);d.scale.setScalar(s);
  d.position.set(x,y+2*s,z);d.updateMatrix();tr.setMatrixAt(k,d.matrix);d.position.set(x,y+5.75*s,z);d.updateMatrix();f1.setMatrixAt(k,d.matrix);d.position.set(x,y+8.5*s,z);d.updateMatrix();f2.setMatrixAt(k,d.matrix);
  cc.set(0x1f4a2a).lerp(cc2.set(0x3f7a3a),Math.random());f1.setColorAt(k,cc);f2.setColorAt(k,cc);k++}
 land.add(tr,f1,f2)}
// Cordilleras: relieve irregular, roca, nieve y bruma con la distancia
function ridge(R0,Hm,seed,low,high,snow,haze){const N=260,M=10,P=[],C=[],I=[],col=new THREE.Color(),lo=new THREE.Color(low),hi=new THREE.Color(high),sn=new THREE.Color(snow),hz=new THREE.Color(0xc79aa6);
 for(let i=0;i<=N;i++){const a=i/N*Math.PI*2,da=Math.abs(Math.atan2(Math.sin(a+Math.PI/2),Math.cos(a+Math.PI/2))),att=clamp01((da-.12)/.55),
  n=Math.sin(a*7+seed)*.4+Math.sin(a*17+seed*2)*.25+Math.sin(a*41+seed*3)*.12+Math.sin(a*83+seed)*.05,H=Hm*(.55+.45*n)*att+10;
  for(let j=0;j<=M;j++){const t=j/M,rr=R0+t*H*.7,y=t*H-10+Math.sin(a*130+j*2.1+seed)*H*.025*t;P.push(Math.cos(a)*rr,y,Math.sin(a)*rr);
   col.copy(lo).lerp(hi,clamp01((t-.3)/.4)).lerp(sn,clamp01((t-.72)/.15)*clamp01((H-Hm*.55)/(Hm*.3))).lerp(hz,haze);C.push(col.r,col.g,col.b)}}
 for(let i=0;i<N;i++)for(let j=0;j<M;j++){const a=i*(M+1)+j,b=a+M+1;I.push(a,b,a+1,b,b+1,a+1)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));g.setIndex(I);g.computeVertexNormals();
 land.add(new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:1,side:THREE.DoubleSide})))}
ridge(430,170,1.3,0x3d5a3a,0x7d8290,0xf2f2f7,.12);ridge(700,320,4.1,0x5f7390,0xaab6cc,0xffffff,.45);
// Nubes suaves hechas de volutas con luz de atardecer
const cpuff=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(.5,'rgba(255,255,255,.4)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)})();
for(let i=0;i<12;i++){const g=new THREE.Group(),base=rnd(110,220);
 for(let j=0;j<16;j++){const hy=rnd(-1,1),sp=new THREE.Sprite(new THREE.SpriteMaterial({map:cpuff,color:cc.set(0xffffff).lerp(cc2.set(0xff9a78),clamp01(.55-hy*.5)).getHex(),transparent:true,opacity:rnd(.5,.85),depthWrite:false}));
  sp.position.set(rnd(-45,45),hy*8,rnd(-18,18));sp.scale.setScalar(rnd(30,60));g.add(sp)}
 const a=rnd(0,6.283),r=rnd(150,420);g.position.set(Math.cos(a)*r,base,Math.sin(a)*r);land.add(g);anim.push((T,dt)=>{g.position.x+=dt*1.2;if(g.position.x>520)g.position.x=-520})}
// Mariposas y aves con alas dibujadas
function wingTex(kind,col){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.fillStyle=col;
 if(kind==='b'){x.strokeStyle='#3a2210';x.lineWidth=4;x.beginPath();x.moveTo(4,64);x.bezierCurveTo(10,8,110,0,124,40);x.bezierCurveTo(128,60,70,72,4,64);x.fill();x.stroke();
  x.beginPath();x.moveTo(4,66);x.bezierCurveTo(50,76,110,80,100,110);x.bezierCurveTo(80,128,20,112,4,66);x.fill();x.stroke();
  x.fillStyle='rgba(255,255,255,.75)';[[88,32,7],[100,92,6],[60,96,5]].forEach(q=>{x.beginPath();x.arc(q[0],q[1],q[2],0,6.3);x.fill()})}
 else{x.beginPath();x.moveTo(0,64);x.bezierCurveTo(30,30,80,26,128,56);x.bezierCurveTo(96,52,60,56,36,74);x.closePath();x.fill()}
 return new THREE.CanvasTexture(c)}
const wing=tex=>{const w=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:tex,transparent:true,alphaTest:.3,side:THREE.DoubleSide}));w.geometry.rotateX(-Math.PI/2);w.geometry.translate(.5,0,0);return w};
function flyer(tex,sz,rad,h,sp,fq,ph){const g=new THREE.Group(),a=wing(tex),b=wing(tex);b.scale.x=-1;g.add(a,b);g.scale.setScalar(sz);land.add(g);
 anim.push(T=>{const t=T*sp+ph;g.position.set(Math.cos(t)*rad,h+Math.sin(T*.7+ph)*1.2,Math.sin(t)*rad-3);g.rotation.y=-t;const f=Math.sin(T*fq)*.8;a.rotation.z=f;b.rotation.z=-f})}
const bt=['#ffb347','#ff7ac8','#5fc8ff','#ffd23f'].map(c=>wingTex('b',c)),bd=wingTex('d','#23232b');
for(let i=0;i<8;i++)flyer(bt[i%4],.38,rnd(5,16),rnd(1,2.5),rnd(.2,.4),14,i*1.7);
for(let i=0;i<7;i++)flyer(bd,2.4,rnd(60,110),rnd(50,90),rnd(.05,.1),5,i*.9);
// Texto flotante pegado a la vista (funciona en VR y en pantalla)
const hc=document.createElement('canvas');hc.width=1024;hc.height=320;const hx=hc.getContext('2d'),hT=new THREE.CanvasTexture(hc);
const HUD=new THREE.Sprite(new THREE.SpriteMaterial({map:hT,transparent:true,depthTest:false,depthWrite:false}));
HUD.renderOrder=999;HUD.position.set(0,-.42,-1.6);HUD.scale.set(2.4,.75,1);C.add(HUD);
function hud(t){hx.clearRect(0,0,1024,320);hx.font='42px Georgia';hx.textAlign='center';hx.fillStyle='#f4ecdf';hx.shadowColor='#000';hx.shadowBlur=10;
 const ls=[];let l='';for(const w of t.split(' ')){const tt=l?l+' '+w:w;if(hx.measureText(tt).width>940&&l){ls.push(l);l=w}else l=tt}ls.push(l);
 ls.forEach((s,i)=>hx.fillText(s,512,160-(ls.length-1)*28+i*56));hT.needsUpdate=true}

// Utilidades de línea de tiempo
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2, lerp=(a,b,t)=>a+(b-a)*t, cl=u=>Math.max(0,Math.min(1,u));
const tweens=[],waits=[];
const tween=(ms,fn)=>new Promise(res=>tweens.push({t0:performance.now(),ms,fn,res}));
const until=f=>new Promise(res=>waits.push({f,res}));
function fillVoices(){if(!window.speechSynthesis)return;const s=$('vsel'),cur=s.value;s.length=1;speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang)).forEach(v=>{const o=document.createElement('option');o.value=v.voiceURI;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});s.value=cur}
if(window.speechSynthesis){fillVoices();speechSynthesis.onvoiceschanged=fillVoices}
function pickVoice(){const vs=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang)),sel=$('vsel').value;if(sel)return vs.find(v=>v.voiceURI===sel);
 for(const l of ['es-CO','es-MX','es-US','es-419'])for(const v of vs)if(v.lang.replace('_','-')===l)return v;return vs.find(v=>!/es-ES/i.test(v.lang))||vs[0]}
// Las frases se encolan: cada una espera a que termine la anterior (antes cancel() cortaba la segunda)
let sp=Promise.resolve();
function tts(t){if(!$('voice').checked||!window.speechSynthesis)return Promise.resolve();
 return new Promise(res=>{const u=new SpeechSynthesisUtterance(t),v=pickVoice();u.lang=v?v.lang:'es-MX';if(v)u.voice=v;u.rate=.92;

function ptex(k){if(!ptc[k])ptc[k]=PT[k]?TL.load(PT[k]):urTex();return ptc[k]}
const ringTex=(()=>{const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
 for(let r=140;r<256;r++){const f=r/256;let a=f<.62?.25:f<.8?.95:f<.84?.08:.7;a*=.7+.3*Math.sin(r*1.7)*Math.cos(r*.43);

 return new THREE.CanvasTexture(c)})();

async function rowScene(pre,items,gmin,zoomMs){
 await fadeTo(1,1200);
 const G=new THREE.Group();S.add(G);const objs=[];let xCur=null,rCur=0;
 const place=it=>{const e=it.e||it.r,x=xCur===null?0:xCur+rCur+Math.max(it.r*.4,gmin)+e;xCur=x;rCur=e;
  const b=it.make(it.r,it.c),mk=mkMark(it.n,it.c);b.add(mk);b.position.x=x;b.userData={r:it.r,mk,idx:objs.length};G.add(b);objs.push(b);return x};
 pre.forEach(place);
 for(const it of items){const x=place(it),left=-objs[0].userData.r,right=x+(it.e||it.r),c=(left+right)/2,half=(right-left)/2,
   hf=R.xr.isPresenting?1.6:2*Math.atan(Math.tan(35*Math.PI/180)*C.aspect),dEnd=Math.max(half/Math.tan(hf/2)*1.15,3*(it.e||it.r)),d0=(it.st||1.15)*it.r;
  G.position.set(-x,0,-d0);upd(objs);
  if(it.snd)approach(10,.55);
  hud('');await fadeTo(0,1200);
  await say(it.i);
  await tween(zoomMs,u=>{const e=ease(u);G.position.x=lerp(-x,-c,e);G.position.z=lerp(-d0,-dEnd,e);upd(objs)});
  await say(it.d);await sleep(1500);
  await fadeTo(1,1200);
 }
 S.remove(G);
}
function mkBall(r,col){const g=new THREE.Group(),m=new THREE.Mesh(new THREE.SphereGeometry(1,64,48),new THREE.MeshBasicMaterial({map:TEX,color:col}));m.scale.setScalar(r);spin.push([m,.1+Math.random()*.3]);g.add(m);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:GT,color:col,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,opacity:.6}));s.scale.setScalar(r*2.6);g.add(s);return g}
function mkMark(name,col){const g=new THREE.Group(),p=new THREE.Points(new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute([0,0,0],3)),
 new THREE.PointsMaterial({color:col,size:7,sizeAttenuation:false,depthTest:false}));p.renderOrder=5;g.add(p);
 const lb=label(name,1);lb.material.depthTest=false;lb.renderOrder=6;g.add(lb);g.userData.lb=lb;return g}
const wv=new THREE.Vector3(),cq=new THREE.Vector3();
function upd(objs){C.getWorldPosition(cq);objs.forEach(o=>{o.getWorldPosition(wv);const d=wv.distanceTo(cq),h=.05*d,u=o.userData,lb=u.mk.userData.lb;lb.scale.set(h*4,h,1);lb.position.y=(u.idx%2?1:-1)*(u.r+h*(.9+1.15*(Math.floor(u.idx/2)%4)));u.mk.children[0].visible=u.r/d<.01})}
// Guion, escenas 1 a 7
async function run(){
 hud('');await sleep(1500);
 await say('A veces sientes que has vivido cosas difíciles. Que hay problemas que no logras resolver y que te superan.');
 await say('Si alguna vez has sentido eso, te invito a algo sencillo: mira hacia el Sol.',1);
 await until(gazeCond);
 await say('Parece pequeño, pero está a 150 millones de kilómetros. Su luz tarda más de 8 minutos en llegar hasta aquí.');
 await sleep(1500);
 await say('Este es todo el mundo que conoces.',3500);
 await sleep(1500);
 await say('Ahora, siéntate.',3500);
 say('¿Ya estás sentado? Por tu seguridad, es muy importante que lo hagas.',1);
 $('sit').style.display='block';
 await until(()=>sitCond(1/60)||selectFlag);
 $('sit').style.display='none';hud('');
 if(!R.xr.isPresenting)tween(2000,u=>C.position.y=lerp(1.6,1.2,ease(u)));
 await sleep(2500);
 // La Tierra se encoge hasta dejar al espectador sentado en el vacío
 tremor(26);await tween(26000,u=>earthAt(ease(u)));
 S.background.set(0x000000);
 await sleep(3500);
 await sleep(1500);
 // El Sol se desvanece antes de que aparezcan los planetas
 await tween(3500,u=>sun.scale.setScalar(lerp(34,.001,ease(u))));sun.visible=false;
 await sleep(2500);
 // Escenas 4 y 5: Tierra, planetas y Sol, uno tras otro en fila con espacio entre ellos
 await rowScene([],PLI,12,7000);
 // Escena 6: el Sol y las estrellas
 await rowScene([{n:'Sol',r:1,c:0xffa733,make:mkBall}],STI,450,12000);
 // Escena 7: regreso, la Tierra crece bajo el espectador
 hud('');earth.visible=true;sun.visible=true;earthAt(1);
 await sleep(1000);await fadeTo(0,2500);
 tremor(26);await tween(26000,u=>earthAt(1-ease(u)));
 earthAt(0);await sleep(3000);
 await say('Frente a todo esto, tus problemas se ven más pequeños de lo que parecían. Y aun así, en este punto diminuto es donde existe todo lo que te importa.');
 await sleep(2000);
 await say('Cuando quieras, puedes ponerte de pie con calma.',6000);
 await fadeTo(1,3000);hud('');
 try{const xs=R.xr.getSession&&R.xr.getSession();if(xs)await xs.end()}catch(e){}
 $('ov').querySelector('p').textContent='Fin de la experiencia. Puedes verla de nuevo cuando quieras.';
 $('go').textContent='Volver a empezar';$('go').onclick=()=>location.reload();$('vr').onclick=()=>location.reload();
 $('ov').style.display='flex';
}
let started=false;
function begin(){audioInit();preloadNarr();if(started)return;started=true;$('ov').style.display='none';run()}
$('go').onclick=begin;
if(navigator.xr){navigator.xr.isSessionSupported('immersive-vr').then(ok=>{if(ok)$('vr').style.display=''}).catch(()=>{})}
$('vr').onclick=async()=>{audioInit();preloadNarr();try{const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor']});
 s.addEventListener('select',()=>{selectFlag=true});await R.xr.setSession(s);$('hint').style.display='none';begin()}catch(e){alert('No se pudo iniciar VR: '+e.message)}};
</script></body></html>
